services:
  - type: web
    name: stu-ai
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/auth/me
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: stu-ai-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: OTP_HMAC_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: Stu.Ai
      - key: STORAGE_PROVIDER
        value: local

databases:
  - name: stu-ai-db
    plan: free
    region: frankfurt
    databaseName: stu_ai
    user: stu_ai_user
